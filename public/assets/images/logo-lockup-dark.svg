<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 110" width="100%" height="100%" role="img" aria-label="BARANGGABAY">
  <defs>
    <linearGradient id="bgGradD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#166534" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="borderGradD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <linearGradient id="goldGradD" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <linearGradient id="mintGradD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="textGabayGradD" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <filter id="glowD" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- EMBLEM ICON (Left Aligned) -->
  <g transform="translate(10, 5)">
    <!-- Base Rounded Shield Background -->
    <rect x="5" y="5" width="90" height="90" rx="24" fill="url(#bgGradD)" />
    <rect x="6" y="6" width="88" height="88" rx="23" fill="none" stroke="url(#borderGradD)" stroke-width="2" opacity="0.85" />

    <!-- Canopy Roof -->
    <path d="M 25,43 L 50,22 L 75,43" fill="none" stroke="url(#mintGradD)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Beacon Star -->
    <circle cx="50" cy="19" r="4" fill="url(#goldGradD)" filter="url(#glowD)" />
    <circle cx="50" cy="19" r="2" fill="#ffffff" />

    <!-- Figures -->
    <circle cx="50" cy="40" r="5.5" fill="url(#goldGradD)" />
    <path d="M 40,61 C 40,52 44,48 50,48 C 56,48 60,52 60,61 Z" fill="url(#mintGradD)" />

    <circle cx="34" cy="46" r="4.5" fill="#ffffff" opacity="0.95" />
    <path d="M 26,64 C 26,57 30,54 35,54 C 38,54 40,56 42,59" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.9" />

    <circle cx="66" cy="46" r="4.5" fill="#ffffff" opacity="0.95" />
    <path d="M 58,59 C 60,56 62,54 65,54 C 70,54 74,57 74,64" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.9" />

    <!-- Connecting Dots -->
    <path d="M 34,46 L 50,40 L 66,46" fill="none" stroke="url(#goldGradD)" stroke-width="1.5" stroke-dasharray="2.5,2.5" opacity="0.85" />

    <!-- Supporting Arch -->
    <path d="M 28,73 C 38,81 62,81 72,73" fill="none" stroke="url(#mintGradD)" stroke-width="3.5" stroke-linecap="round" />
  </g>

  <!-- WORDMARK (Right of Icon) -->
  <g transform="translate(120, 0)">
    <!-- BARANG -->
    <text x="0" y="58" font-family="System-UI, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="42" font-weight="900" fill="#ffffff" letter-spacing="1">BARANG</text>

    <!-- GABAY -->
    <text x="188" y="58" font-family="System-UI, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="42" font-weight="900" fill="url(#textGabayGradD)" letter-spacing="1">GABAY</text>

    <!-- Accent Underline Beacon -->
    <rect x="0" y="68" width="318" height="3" rx="1.5" fill="url(#textGabayGradD)" opacity="0.75" />
    <circle cx="186" cy="69.5" r="3.5" fill="url(#goldGradD)" filter="url(#glowD)" />

    <!-- Tagline -->
    <text x="1" y="92" font-family="System-UI, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#94a3b8" letter-spacing="3.2">YOUR BARANGAY. CONNECTED.</text>
  </g>
</svg>
