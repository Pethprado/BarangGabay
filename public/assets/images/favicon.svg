<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%" role="img" aria-label="BarangGabay Icon">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#166534" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Shield Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <!-- Inner Emblem Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Shield Background -->
  <rect x="6" y="6" width="116" height="116" rx="30" fill="url(#bgGrad)" />
  <rect x="7" y="7" width="114" height="114" rx="29" fill="none" stroke="url(#borderGrad)" stroke-width="2.5" opacity="0.85" />

  <!-- Subtle Shield Path / B-curve Motif -->
  <path d="M 64,18 C 88,18 104,26 104,50 C 104,78 84,102 64,110 C 44,102 24,78 24,50 C 24,26 40,18 64,18 Z" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.15" />

  <!-- Barangay Protective Canopy (Roof) -->
  <path d="M 32,54 L 64,28 L 96,54" fill="none" stroke="url(#mintGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Glowing Beacon / Guidance Star at Roof Apex -->
  <circle cx="64" cy="24" r="5" fill="url(#goldGrad)" filter="url(#glow)" />
  <circle cx="64" cy="24" r="2.5" fill="#ffffff" />

  <!-- Interconnected Community Figures (People + Digital Network Nodes) -->
  <!-- Central Leader / Figure -->
  <circle cx="64" cy="50" r="7" fill="url(#goldGrad)" />
  <path d="M 52,76 C 52,65 57,60 64,60 C 71,60 76,65 76,76 Z" fill="url(#mintGrad)" />

  <!-- Left Resident Figure -->
  <circle cx="44" cy="58" r="5.5" fill="#ffffff" opacity="0.95" />
  <path d="M 34,80 C 34,71 39,67 45,67 C 49,67 52,69 54,73" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" opacity="0.9" />

  <!-- Right Resident Figure -->
  <circle cx="84" cy="58" r="5.5" fill="#ffffff" opacity="0.95" />
  <path d="M 74,73 C 76,69 79,67 83,67 C 89,67 94,71 94,80" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" opacity="0.9" />

  <!-- Connecting Network Lines (Community Connection / Digital Gabay) -->
  <path d="M 44,58 L 64,50 L 84,58" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="3,3" opacity="0.85" />

  <!-- Base Supporting Hands / Shield Base -->
  <path d="M 36,92 C 48,102 80,102 92,92" fill="none" stroke="url(#mintGrad)" stroke-width="4" stroke-linecap="round" />
</svg>
