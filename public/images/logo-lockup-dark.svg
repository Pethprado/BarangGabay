     wordmark instead of dark ink. -->
<defs>
  <linearGradient id="hexGradD" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#a3311c"/>
    <stop offset="100%" stop-color="#7b1e22"/>
  </linearGradient>
</defs>

<polygon points="55,8 95,8 115,42 95,76 55,76 35,42" fill="url(#hexGradD)"/>
<polygon points="57,11 93,11 111,42 93,73 57,73 39,42" fill="none" stroke="#e2b955" stroke-width="1.2" opacity="0.75"/>
<polygon points="61,17 89,17 105,42 89,67 61,67 45,42" fill="none" stroke="#e2b955" stroke-width="0.6" opacity="0.4"/>

